[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyter-kernel-origin-gate"
version = "0.1.0"
description = "Origin-bound authorization for a single-user Jupyter kernel API"
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE"]
authors = [{ name = "dhtfish98" }]
dependencies = ["jupyter_server>=2.17,<3"]
readme = "项目文档/README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["ipykernel>=6.29,<8", "aiohttp>=3.11,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_kernel_origin_gate"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/项目文档"]
